<style>
:root{
  --wine:#7A1F3D; --wine-d:#5C1630; --violet:#5E35B1; --lav:#EDE7F6; --lav2:#D1C4E9;
  --bg:#F7F4FA; --card:#fff; --ink:#241B2F; --mute:#6E6479; --line:#E4DDEB;
  --red:#B3261E; --green:#1E7B4F; --amber:#B26A00;
  --r:14px; --tab:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h2{font-size:18px;margin:18px 0 8px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--mute)} .small{font-size:13px} .right{text-align:right}
.red{color:var(--red)} .green{color:var(--green)} .amber{color:var(--amber)}
.nowrap{white-space:nowrap}

/* header + layout */
.top{position:sticky;top:0;z-index:20;background:var(--wine);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:auto;background:#EDE7F6;border-radius:8px;padding:3px}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:16px;line-height:1.1}
.top .who span{font-size:12px;opacity:.85}
.sync{border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
.sync.off{background:#fff;color:var(--amber)}
.sync.pend{background:#fff;color:var(--wine)}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px calc(var(--tab) + 110px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);font-weight:600}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--wine)}
.banner{background:var(--lav);color:var(--violet);padding:9px 14px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.banner button{border:0;background:var(--violet);color:#fff;border-radius:8px;padding:6px 10px}
.banner.warn{background:#FFF2D9;color:#7A4B00}

/* cards + bits */
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(60,20,80,.07)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:0 1px 2px rgba(60,20,80,.07)}
.stat span{display:block;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat b{display:block;font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.wine{background:var(--wine);color:#fff}.stat.wine span{color:#F0D9E2}
.stat.violet{background:var(--violet);color:#fff}.stat.violet span{color:#E4DAF7}
.stat.wide{grid-column:1/3}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--lav);color:var(--violet)}
.btn.primary{background:var(--wine);color:#fff}
.btn.violet{background:var(--violet);color:#fff}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:#FBE6E4;color:var(--red)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45}
input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-height:46px}
input:focus,select:focus{outline:none;border-color:var(--violet)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--mute)}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--lav);color:var(--violet)}
.badge.red{background:#FBE6E4;color:var(--red)} .badge.green{background:#DDF3E8;color:var(--green)} .badge.amber{background:#FFF0D2;color:var(--amber)}

/* sell */
.pick{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick b{color:var(--wine)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{border:0;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(60,20,80,.1);padding:12px 8px;text-align:center;min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative}
.tile b{font-size:14px;line-height:1.15}
.tile span{color:var(--violet);font-weight:700;font-size:14px}
.tile i{position:absolute;top:-6px;right:-4px;background:var(--wine);color:#fff;border-radius:999px;font-style:normal;font-size:12px;font-weight:700;min-width:22px;height:22px;line-height:22px;padding:0 5px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.line .nm{font-weight:600}
.line .amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700;line-height:1}
.step input{width:64px;min-height:36px;padding:4px 6px;text-align:center}
.step .pr{width:78px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 2px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));z-index:15;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;max-width:none}
.bar .tot{flex:1}
.bar .tot b{font-size:20px;display:block;font-variant-numeric:tabular-nums}
.bar .tot span{font-size:12px;color:var(--mute)}
.bar .btn{min-width:150px}

/* lists */
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--lav);color:var(--violet);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.amt{font-variant-numeric:tabular-nums;font-weight:700}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(36,27,47,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin-top:2px}
.sheet .x{float:right;border:0;background:var(--lav);width:34px;height:34px;border-radius:50%;font-size:18px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.receipt{font-variant-numeric:tabular-nums}
.receipt .l{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.receipt hr{border:0;border-top:1px dashed var(--lav2);margin:8px 0}
.receipt .tot{font-weight:800;font-size:18px}

/* charts */
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bars div{flex:1;background:var(--lav2);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.hi{background:var(--wine)}
.bars div.sel{background:var(--violet)}
.axis{display:flex;gap:3px;font-size:10px;color:var(--mute);margin-top:3px}
.axis span{flex:1;text-align:center;overflow:hidden}
.hbar{height:8px;border-radius:99px;background:var(--lav);overflow:hidden;margin-top:5px}
.hbar i{display:block;height:100%;background:var(--violet);border-radius:99px}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login .logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.login .logo img{width:84px}
.login .logo b{font-size:34px;font-weight:800;line-height:1;color:var(--wine);letter-spacing:-1px}
.login .logo b em{font-style:normal;color:var(--violet)}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 90px);transform:translateX(-50%) translateY(20px);background:#241B2F;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== The only line to change when the system moves to a new owner: ===== */
window.KL_CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbyAazoioLodddEzwyM8DsBFIeTrr6FvQC_NDyZAGuCc2UbtFEVG2Wozso18QzrBsjDf/exec", BUSINESS: "KL Bread" };
</script>
<script>
/* KL Bread - sales app. Works offline: sales are saved on the device first, then sent when there is signal. */
(function () {
'use strict';

const CFG = window.KL_CONFIG || {};
const WALKIN = 'Walk-in';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = n => 'GH₵ ' + r2(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kk = s => String(s == null ? '' : s).trim().toLowerCase();
const p2 = n => (n < 10 ? '0' : '') + n;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const nowTime = () => { const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); };
const uid = pre => pre + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
const initials = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);

/* ---------------- storage (IndexedDB) ---------------- */
let _db;
function db() {
  return _db || (_db = new Promise((res, rej) => {
    const r = indexedDB.open('klbread', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('kv');
      ['queue', 'applied', 'failed'].forEach(n => d.createObjectStore(n, { keyPath: 'id' }));
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function tx(store, mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const rq = fn(t.objectStore(store));
    if (rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
  }));
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const kvDel = k => tx('kv', 'readwrite', s => s.delete(k));
const getAll = st => tx(st, 'readonly', s => s.getAll());
const putOne = (st, v) => tx(st, 'readwrite', s => s.put(v));
const delOne = (st, id) => tx(st, 'readwrite', s => s.delete(id));
const byTs = (a, b) => (a.ts || 0) - (b.ts || 0);

/* ---------------- state ---------------- */
const S = {
  session: null, cache: null, queue: [], applied: [], failed: [],
  apiUrl: '', online: navigator.onLine, syncing: false, lastSync: 0, keyBad: false,
  tab: 'sell', cf: 'mine', cq: '',
  cart: { customer: null, lines: [], mode: 'cash', cash: '', momo: '' },
  rep: null, repFresh: false, sel: { year: new Date().getFullYear(), month: new Date().getMonth() + 1 },
  lists: null, installEvt: null
};

function loadCart() { try { const c = JSON.parse(localStorage.getItem('kl_cart')); if (c && Array.isArray(c.lines)) S.cart = c; } catch (e) { /* ignore */ } }
function saveCart() { try { localStorage.setItem('kl_cart', JSON.stringify(S.cart)); } catch (e) { /* ignore */ } }
function clearCart() { S.cart = { customer: null, lines: [], mode: 'cash', cash: '', momo: '' }; saveCart(); }

/* ---------------- network ---------------- */
async function api(action, body) {
  body = body || {};
  if (!S.apiUrl) throw new Error('no_url');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const payload = Object.assign({ action, key: S.session && S.session.key, today: today() }, body);
    const res = await fetch(S.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: ctrl.signal, redirect: 'follow' });
    return await res.json();
  } finally { clearTimeout(timer); }
}

/* ---------------- derived view (cache + unsent work) ---------------- */
function derived() {
  const c = S.cache, t0 = today(), me = S.session.name;
  const custs = new Map();
  ((c && c.customers) || []).forEach(x => custs.set(kk(x.name), Object.assign({}, x)));
  const b0 = c && c.today === t0 ? c.mine : { today: { sales: 0, cash: 0, momo: 0, credit: 0 }, cashHeld: c ? c.mine.cashHeld : 0, bills: [] };
  const mine = { today: Object.assign({}, b0.today), cashHeld: b0.cashHeld, bills: b0.bills.slice() };
  const ops = S.applied.concat(S.queue).sort(byTs);
  ops.forEach(op => {
    const k = kk(op.customer || op.name);
    if (op.type === 'customer') {
      if (!custs.has(k)) custs.set(k, { name: op.name, phone: op.phone || '', location: op.location || '', person: me, balance: 0, last: '' });
      return;
    }
    if (k && k !== kk(WALKIN) && !custs.has(k)) custs.set(k, { name: op.customer, phone: '', location: '', person: me, balance: 0, last: '' });
    const cu = custs.get(k);
    if (op.type === 'sale') {
      const total = r2(sum(op.items, i => i.q * i.u));
      if (cu && cu.balance != null) { cu.balance = r2(cu.balance + total - op.cash - op.momo); if (op.date > (cu.last || '')) cu.last = op.date; }
      mine.cashHeld = r2(mine.cashHeld + op.cash);
      if (op.date === t0) {
        mine.today.sales = r2(mine.today.sales + total); mine.today.cash = r2(mine.today.cash + op.cash); mine.today.momo = r2(mine.today.momo + op.momo);
        mine.today.credit = r2(mine.today.credit + Math.max(0, total - op.cash - op.momo));
        mine.bills.push({ id: op.id, time: op.time, customer: op.customer, items: op.items, total, cash: op.cash, momo: op.momo, pending: true });
      }
    } else if (op.type === 'payment') {
      if (cu && cu.balance != null) cu.balance = r2(cu.balance - op.cash - op.momo);
      mine.cashHeld = r2(mine.cashHeld + op.cash);
      if (op.date === t0) { mine.today.cash = r2(mine.today.cash + op.cash); mine.today.momo = r2(mine.today.momo + op.momo); }
    }
  });
  return { customers: Array.from(custs.values()), mine };
}

/* ---------------- sync ---------------- */
let syncTimer;
function syncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), 700); }

async function syncNow(manual) {
  if (S.syncing || !S.session) return;
  S.syncing = true; paintStatus();
  try {
    let guard = 0;
    while (S.queue.length && guard++ < 20) {
      const batch = S.queue.slice().sort(byTs).slice(0, 40);
      const r = await api('sync', { ops: batch });
      if (!r.ok) { if (r.error === 'bad_key') { S.keyBad = true; break; } throw new Error(r.error || 'sync'); }
      for (const res of r.results) {
        const op = S.queue.find(o => o.id === res.id);
        if (!op) continue;
        S.queue = S.queue.filter(o => o.id !== op.id);
        await delOne('queue', op.id);
        if (res.ok) { S.applied.push(op); await putOne('applied', op); }
        else { const f = Object.assign({}, op, { error: res.error }); S.failed.push(f); await putOne('failed', f); }
      }
    }
    if (!S.keyBad) {
      const snap = S.applied.map(o => o.id);
      const b = await api('bootstrap');
      if (b.ok) {
        S.cache = b; await kvSet('cache', b);
        S.applied = S.applied.filter(o => !snap.includes(o.id));
        for (const id of snap) await delOne('applied', id);
        S.lastSync = Date.now(); S.online = true;
        if (S.session.role === 'admin' && (S.tab === 'dash' || S.tab === 'cash')) await fetchReport();
      } else if (b.error === 'bad_key') S.keyBad = true;
    }
  } catch (e) {
    if (manual) toast('No connection - your sales are safe on this phone');
  } finally {
    S.syncing = false; render(true);
  }
}

/* ---------------- boot ---------------- */
async function boot() {
  S.apiUrl = localStorage.getItem('kl_api') || CFG.API_URL || '';
  loadCart();
  try {
    S.session = (await kvGet('session')) || null;
    S.cache = (await kvGet('cache')) || null;
    S.rep = (await kvGet('report')) || null;
    S.queue = (await getAll('queue')).sort(byTs);
    S.applied = (await getAll('applied')).sort(byTs);
    S.failed = await getAll('failed');
  } catch (e) { fatal('This browser cannot store data offline. Try Chrome or Safari (not private mode).'); return; }
  S.tab = S.session && S.session.role === 'admin' ? 'dash' : 'sell';
  render();
  registerSW();
  if (S.session) { syncNow(); }
  window.addEventListener('online', () => { S.online = true; paintStatus(); syncNow(); });
  window.addEventListener('offline', () => { S.online = false; paintStatus(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });

async function doLogin() {
  const key = $('#lkey').value.trim(), urlEl = $('#lurl'), err = $('#lerr'), btn = $('#lbtn');
  if (urlEl) { const u = urlEl.value.trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { err.textContent = 'That does not look like the server link.'; return; } S.apiUrl = u.split('?')[0]; localStorage.setItem('kl_api', S.apiUrl); }
  if (key.length < 4) { err.textContent = 'Please type your key.'; return; }
  btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
  try {
    const old = S.session; S.session = { key };
    const r = await api('login');
    if (!r.ok) { S.session = old; err.textContent = errText(r.error); return; }
    S.session = { key, name: r.user.name, role: r.user.role };
    await kvSet('session', S.session);
    S.keyBad = false; S.tab = S.session.role === 'admin' ? 'dash' : 'sell';
    const b = await api('bootstrap');

    S.session = null; err.textContent = 'Could not reach the server. Check your internet and the server link.';
  } finally { const b2 = $('#lbtn'); if (b2) { b2.disabled = false; b2.textContent = 'Sign in'; } }
}
